# NOT applied via `kubectl apply -f` — documents the Secret's shape only.
# The real object is created live via:
#   kubectl create secret generic backend-secrets \
#     --from-literal=GROQ_API_KEY="$(gcloud secrets versions access latest --secret=GROQ_API_KEY --project=<PROJECT_ID>)" \
#     --from-literal=GEMINI_API_KEY="$(gcloud secrets versions access latest --secret=GEMINI_API_KEY --project=<PROJECT_ID>)"
# never written to disk, never committed — same invariant as every other
# secret in this repo (Terraform provisions containers only, gcloud sets
# real values out of band).
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
type: Opaque
data: {}
