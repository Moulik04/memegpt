[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memegpt-backend"
version = "0.1.0"
description = "MemeGPT FastAPI backend"
requires-python = ">=3.11"

dependencies = [
    # API framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",

    # Data validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",

    # Image processing
    "Pillow>=10.3.0",

    # Vector DB
    "chromadb>=0.5.0",

    # File handling / utilities
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",

    # Upload rate limiting (Phase 0 safety gate)
    "slowapi>=0.1.9",

    # Durable storage (Growth Phase B) — S3-compatible client for Cloudflare R2
    "boto3>=1.34.0",

    # Postgres layer (Growth Phase B) — raw asyncpg, no ORM (matches this
    # repo's existing minimalism: raw httpx for Groq/vision, no SDKs)
    "asyncpg>=0.29.0",

    # Observability (cloud-migration Phase 4) — OpenTelemetry push-based
    # metrics/logs to Grafana Cloud. Push, not the more common pull-based
    # prometheus-fastapi-instrumentator, because Cloud Run scales to zero
    # and there's nothing reliably scraping a pull endpoint on an instance
    # that isn't running right now — see docs/superpowers/specs/2026-09-01-
    # cloud-migration-phase4-observability-design.md.
    "opentelemetry-api>=1.42.0",
    "opentelemetry-sdk>=1.42.0",
    "opentelemetry-exporter-otlp-proto-http>=1.42.0",
    "opentelemetry-instrumentation-fastapi>=0.63b0",
    "structlog>=26.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
include = ["routers*", "nlp*", "vector_db*", "image_processing*", "memory*", "uploads*", "storage*", "db*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
