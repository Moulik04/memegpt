name: Verify secrets

# Manual check that the API keys stored as repository secrets are accepted
# by their providers. Each step makes one read-only "list models" request
# and prints the HTTP status, nothing else. It spends no generation quota
# and writes nothing, so it is safe to run at any time.
#
# The trend pipeline is the only workflow that reads these secrets, and a
# real run of it commits to main. This gives a way to confirm the keys
# work without one. Run it from the Actions tab (Verify secrets -> Run
# workflow) after changing either secret.

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Groq key
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "${GROQ_API_KEY}" ]; then echo "::error::GROQ_API_KEY is empty"; exit 1; fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "Authorization: Bearer ${GROQ_API_KEY}" \
            https://api.groq.com/openai/v1/models)
          echo "Groq: HTTP ${code}"
          [ "${code}" = "200" ] || { echo "::error::Groq rejected GROQ_API_KEY (HTTP ${code})"; exit 1; }

      # The key goes in a header, not the query string, so it never appears
      # in a logged URL. `always()` so one bad key doesn't hide the other.
      - name: Gemini key
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "${GEMINI_API_KEY}" ]; then echo "::error::GEMINI_API_KEY is empty"; exit 1; fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "x-goog-api-key: ${GEMINI_API_KEY}" \
            https://generativelanguage.googleapis.com/v1beta/models)
          echo "Gemini: HTTP ${code}"
          [ "${code}" = "200" ] || { echo "::error::Gemini rejected GEMINI_API_KEY (HTTP ${code})"; exit 1; }
