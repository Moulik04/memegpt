name: CI (PR checks)

# Lint, full pytest suite, terraform plan, and a container build — on every
# PR against main. Never deploys, never pushes an image, never applies
# Terraform. See .github/workflows/ci-deploy.yml for what runs on merge.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write # required for google-github-actions/auth's WIF exchange

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Ruff lint
        working-directory: backend
        run: ruff check .

      - name: pytest (full suite)
        working-directory: backend
        # Deliberately does NOT set GROQ_API_KEY. This copied trend-
        # pipeline.yml's pattern without checking it against this test
        # suite's actual design — caught for real on the first PR that
        # ever ran this job: the whole suite assumes no real key in the
        # ambient environment (several tests document this explicitly,
        # e.g. test_multi_image_chat.py, test_regression_text_chat.py,
        # test_safe_ingest.py); tests that need a key construct their own
        # fake Settings object directly instead. Setting a real key here
        # broke test_generate_moderation.py::test_no_groq_key_fails_
        # closed_by_default, which calls the real moderate_text() and
        # asserts it fails closed specifically BECAUSE no key is
        # configured — with a real key present, moderation legitimately
        # passed and the test's own assertion (compose_meme must not run)
        # correctly caught that its precondition no longer held. Confirmed
        # locally: all 256 tests pass with no real GROQ_API_KEY set.
        run: pytest

  terraform-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3

      - name: terraform init
        working-directory: terraform
        run: terraform init -backend-config="bucket=${{ vars.GCP_PROJECT_ID }}-tfstate" -backend-config="prefix=memegpt-backend"

      - name: terraform plan
        working-directory: terraform
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
        run: |
          # `terraform output -raw` with no output name always errors — the
          # original version of this line swallowed that error and fell
          # back to a placeholder digest on every single PR, which showed
          # up as a permanent, spurious "image changed" line in every
          # plan. Read the real live digest by its actual output name
          # instead — the PR hasn't built anything of its own yet, so
          # reusing the currently-deployed digest is correct: a plan is
          # about catching *other* config drift, not proposing a new image.
          DIGEST=$(terraform output -raw cloud_run_image_digest) \
            || { echo "::error::Could not read cloud_run_image_digest from state — aborting the plan rather than showing a spurious diff."; exit 1; }
          terraform plan \
            -var="cloud_run_image_digest=${DIGEST}" \
            -lock=false

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no push)
        run: docker build -t memegpt-backend:pr-check -f backend/Dockerfile .
