name: CI (PR checks)

# Lint, full pytest suite, terraform plan, and a container build — on every
# PR against main. Never deploys, never pushes an image, never applies
# Terraform. See .github/workflows/ci-deploy.yml for what runs on merge.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write # required for google-github-actions/auth's WIF exchange

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Ruff lint
        working-directory: backend
        run: ruff check .

      - name: pytest (full suite)
        working-directory: backend
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: pytest

  terraform-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3

      - name: terraform init
        working-directory: terraform
        run: terraform init -backend-config="bucket=${{ vars.GCP_PROJECT_ID }}-tfstate" -backend-config="prefix=memegpt-backend"

      - name: terraform plan
        working-directory: terraform
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
        run: |
          # `terraform output -raw` with no output name always errors — the
          # original version of this line swallowed that error and fell
          # back to a placeholder digest on every single PR, which showed
          # up as a permanent, spurious "image changed" line in every
          # plan. Read the real live digest by its actual output name
          # instead — the PR hasn't built anything of its own yet, so
          # reusing the currently-deployed digest is correct: a plan is
          # about catching *other* config drift, not proposing a new image.
          DIGEST=$(terraform output -raw cloud_run_image_digest 2>/dev/null) \
            || { echo "::error::Could not read cloud_run_image_digest from state — aborting the plan rather than showing a spurious diff."; exit 1; }
          terraform plan \
            -var="cloud_run_image_digest=${DIGEST}" \
            -lock=false

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no push)
        run: docker build -t memegpt-backend:pr-check -f backend/Dockerfile .
