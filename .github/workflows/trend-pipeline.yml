name: Trend pipeline

# Growth master prompt Phase E — weekly, human-in-the-loop template
# discovery. Scans Imgflip's free public template list for anything
# genuinely new (not just renamed — see backend/scripts/trend_pipeline.py's
# perceptual-hash dedup), drafts a catalog entry for it, and opens a PR.
# NEVER auto-merges — the repo is the database, a human is the reviewer.
#
# workflow_dispatch lets you trigger a real run manually (Actions tab ->
# Trend pipeline -> Run workflow) instead of waiting for Monday, e.g. right
# after adding the GROQ_API_KEY secret the first time.

on:
  schedule:
    - cron: "0 13 * * 1" # every Monday, 13:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run trend pipeline
        working-directory: backend
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m scripts.trend_pipeline

      - name: Check for changes
        id: changes
        run: echo "dirty=$(if [ -n "$(git status --porcelain)" ]; then echo true; else echo false; fi)" >> "$GITHUB_OUTPUT"

      - name: Open PR with new template candidate(s)
        if: steps.changes.outputs.dirty == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "New meme template candidate(s) from this week's Imgflip scan"
          branch: trend-pipeline/auto-update
          title: "New meme template candidate(s) found"
          body-path: backend/trend_pipeline_pr_body.md
          labels: trend-pipeline
          delete-branch: true
