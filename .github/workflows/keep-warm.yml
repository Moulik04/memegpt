name: Keep backend warm

# Render's free tier spins the backend down after ~15 minutes idle, and the
# resulting ~30s cold-start can eat a downstream caller's own response-time
# budget (e.g. the Discord integration's Cloudflare Worker only gets a 30s
# ctx.waitUntil() window). Pinging /health every 10 minutes (under Render's
# 15-minute idle threshold) keeps the instance warm so real requests don't
# pay the cold-start tax. Free: this is a GET request to a public health
# endpoint, no secrets, no repo checkout even needed.
#
# Retries: Render's *.onrender.com domains sit behind Cloudflare, and
# GitHub Actions runners draw from a large, shared, rotating IP pool whose
# reputation with Cloudflare varies request to request, occasionally
# causing a scheduled ping to time out with 0 bytes received even though
# the backend itself is healthy and reachable from other networks. A
# same-run retry (a fresh TCP connection, often enough to land on a
# different edge/IP) absorbs this transient per-IP blocking.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: >
          curl -fsS --max-time 90 --retry 3 --retry-delay 5 --retry-all-errors
          https://memegpt-backend.onrender.com/health
