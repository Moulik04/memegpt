name: CI (deploy)

# On every push to main: build, push to Artifact Registry, deploy a
# candidate revision with ZERO live traffic, smoke-test that candidate's
# own dedicated URL, and only promote it to 100% traffic (via `terraform
# apply`) if the smoke test passes. A failed smoke test reports the
# failure and stops — the live service was never touched, so there is
# nothing to "roll back." Cloud Run refuses to delete a service's
# most-recently-created revision regardless of traffic share, so a failed
# candidate can't be cleaned up in the same run — but it's a live,
# secret-bearing, publicly-invokable endpoint (this repo is public, so its
# tag, derived from the commit SHA, is trivially guessable), so leaving it
# up isn't just harmless clutter. The job's LAST step (which always runs,
# success or failure) deletes every revision for this service except
# whichever ones are currently serving traffic, most-recently-created, or
# most-recently-ready — by the time it runs, this run has already created
# (and, if the smoke test passed, promoted) its own revision, so any
# leftover from a PRIOR run no longer qualifies for any of those three and
# can finally be deleted. It aborts rather than deletes anything if it
# can't positively determine what to keep — see the step's own comment for
# why an empty result must never be treated as "nothing to protect." A
# separate step immediately removes a failed candidate's public tag (not
# just its traffic share) on smoke-test failure, so its guessable URL
# stops resolving right away rather than waiting for the next run's sweep.
#
# Deliberately does NOT retain extra revisions as a "rollback target"
# beyond the currently-live revision itself (which KEEP already
# protects — after a successful promotion it collapses to that one
# revision, and the previous good one IS deleted by the sweep). An
# earlier attempt at extra retention kept revisions by raw creation
# order, which after a failure-then-success sequence could resurrect a
# revision that had FAILED its own smoke test as the presented
# "rollback" candidate. Getting that right needs distinguishing
# "previously served real traffic" from "was once a candidate," which
# this mechanism doesn't currently track; recovery via rebuild-and-
# reapply (Artifact Registry retains recent images) remains the correct
# path until that's designed properly, not bolted on.

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false # let an in-flight deploy finish; never cancel mid-promotion

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev

      - name: Build and push
        id: push
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_SERVICE_NAME }}/${{ vars.GCP_SERVICE_NAME }}"
          TAG="sha-${GITHUB_SHA::7}"
          docker build -t "${IMAGE}:${TAG}" -f backend/Dockerfile .
          docker push "${IMAGE}:${TAG}"
          DIGEST=$(gcloud artifacts docker images describe "${IMAGE}:${TAG}" --format="value(image_summary.digest)" | sed 's/^sha256://')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Deploy candidate revision (no traffic)
        id: candidate
        run: |
          TAG="ci-${GITHUB_SHA::7}"
          gcloud run deploy ${{ vars.GCP_SERVICE_NAME }} \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --region=${{ vars.GCP_REGION }} \
            --image="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_SERVICE_NAME }}/${{ vars.GCP_SERVICE_NAME }}@sha256:${{ steps.push.outputs.digest }}" \
            --no-traffic \
            --tag="${TAG}" \
            --quiet
          URL=$(gcloud run services describe ${{ vars.GCP_SERVICE_NAME }} --project=${{ vars.GCP_PROJECT_ID }} --region=${{ vars.GCP_REGION }} --format=json | jq -r --arg TAG "${TAG}" '.status.traffic[] | select(.tag == $TAG) | .url')
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Smoke test the candidate (NOT the live URL)
        id: smoke
        run: |
          set -e
          curl -sf "${{ steps.candidate.outputs.url }}/health"
          curl -sf "${{ steps.candidate.outputs.url }}/docs" -o /dev/null

      - uses: hashicorp/setup-terraform@v3
        if: success()

      - name: Promote via terraform apply
        if: success()
        working-directory: terraform
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_cloud_run_image_digest: ${{ steps.push.outputs.digest }}
        run: |
          terraform init -backend-config="bucket=${{ vars.GCP_PROJECT_ID }}-tfstate" -backend-config="prefix=memegpt-backend"
          terraform apply -auto-approve

      - name: Smoke test failed — remove its public tag and stop (candidate never promoted)
        # A bare `steps.smoke.outcome == 'failure'` gets an implicit
        # `success()` ANDed in by GitHub Actions whenever a step's `if:`
        # contains no explicit status-check function — which makes THIS
        # step unsatisfiable, since success() is already false the moment
        # smoke fails. `failure()` supplies that explicit function (and
        # correctly reflects "something upstream failed"); the
        # `steps.smoke.outcome` clause narrows that down to specifically
        # the smoke test, not e.g. a later terraform apply failure.
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          gcloud run services update-traffic ${{ vars.GCP_SERVICE_NAME }} --project=${{ vars.GCP_PROJECT_ID }} --region=${{ vars.GCP_REGION }} --remove-tags="${{ steps.candidate.outputs.tag }}" --quiet \
            || echo "::warning::Could not remove tag ${{ steps.candidate.outputs.tag }} — the URL may stay reachable until the cleanup sweep below, or a future run, removes it"
          echo "::error::Smoke test failed against candidate revision (tag: ${{ steps.candidate.outputs.tag }}, url: ${{ steps.candidate.outputs.url }}). It was never promoted — live traffic is unaffected (still served by the previous revision). Its public tag has been removed so that URL stops resolving now, rather than waiting for the next cleanup sweep; the revision itself can't be deleted this run (Cloud Run refuses to delete a service's most-recently-created revision) but is no longer directly reachable."
          exit 1

      - name: Delete stale untrafficked candidate revisions from prior runs
        if: always()
        continue-on-error: true # best-effort cleanup — must never flip an otherwise-successful deploy to failed
        run: |
          set -euo pipefail
          # Deliberately NOT based on `.status.traffic[]`'s tag/url data — a
          # real, documented terraform-provider-google issue (#8654) means a
          # `terraform apply` that touches this service strips that data on
          # every apply. `revisionName`/`percent` inside the same traffic
          # list are NOT affected by that bug, so this is safe to read.
          # KEEP is every revision that must never be deleted: whatever is
          # ACTUALLY carrying nonzero traffic right now (not just tagged —
          # `gcloud run deploy --tag` is purely additive, so a smoke-test
          # failure's untrafficked, 0%-traffic tag entry stays in
          # .status.traffic[] indefinitely across consecutive failed runs;
          # counting it here would mean a stale orphan never becomes
          # deletable at all once a second failure lands), whatever's
          # most-recently-created (Cloud Run refuses to delete that one
          # anyway, but this also spares it a doomed delete attempt), and
          # whatever's most-recently-ready (covers a just-created
          # --no-traffic candidate that hasn't been promoted, e.g. THIS
          # run's own candidate on a smoke-test failure). If this comes
          # back empty — describe/jq failed, or the service has no
          # revisions at all — abort rather than treat an empty KEEP set
          # as "nothing to protect": that emptiness is exactly the failure
          # mode that would otherwise point `gcloud run revisions delete`
          # at every revision, including the one serving live traffic.
          DESC=$(gcloud run services describe ${{ vars.GCP_SERVICE_NAME }} --project=${{ vars.GCP_PROJECT_ID }} --region=${{ vars.GCP_REGION }} --format=json) \
            || { echo "::error::Could not fetch service state — aborting the sweep without deleting anything."; exit 1; }
          KEEP=$(echo "${DESC}" | jq -r '[(.status.traffic[] | select((.percent // 0) > 0) | .revisionName), .status.latestCreatedRevisionName, .status.latestReadyRevisionName] | .[] | select(. != null)' | sort -u) \
            || { echo "::error::Could not parse service state — aborting the sweep without deleting anything."; exit 1; }
          if [ -z "${KEEP}" ]; then
            echo "::error::Could not determine which revisions to keep — aborting the sweep without deleting anything."
            exit 1
          fi
          gcloud run revisions list --service=${{ vars.GCP_SERVICE_NAME }} --project=${{ vars.GCP_PROJECT_ID }} --region=${{ vars.GCP_REGION }} --format="value(name)" \
            | while read -r rev; do
                if ! grep -qxF "${rev}" <<< "${KEEP}"; then
                  echo "Deleting stale revision: ${rev}"
                  gcloud run revisions delete "${rev}" --project=${{ vars.GCP_PROJECT_ID }} --region=${{ vars.GCP_REGION }} --quiet || echo "::warning::Could not delete ${rev} (may still be the latest-created revision — will retry next run)"
                fi
              done
