name: CI (deploy)

# On every push to main: build, push to Artifact Registry, deploy a
# candidate revision with ZERO live traffic, smoke-test that candidate's
# own dedicated URL, and only promote it to 100% traffic (via `terraform
# apply`) if the smoke test passes. A failed smoke test reports the
# failure and stops — the live service was never touched, so there is
# nothing to "roll back." Cloud Run refuses to delete a service's
# most-recently-created revision regardless of traffic share, so a failed
# candidate can't be cleaned up in the same run — but it's a live,
# secret-bearing, publicly-invokable endpoint (this repo is public, so its
# tag, derived from the commit SHA, is trivially guessable), so leaving it
# up isn't just harmless clutter. The job's LAST step (which always runs,
# success or failure) deletes every revision for this service except
# whichever one `status.latestReadyRevision` names — by the time it runs,
# this run has already created and (if the smoke test passed) promoted its
# own newer revision, so any leftover from a PRIOR run is no longer
# latest-created and can finally be deleted. It intentionally does NOT use
# the traffic list's tag/url data to identify candidates — `terraform
# apply` strips that data on every apply (a known terraform-provider-google
# issue), which silently blinded an earlier version of this sweep on every
# successful run.

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev

      - name: Build and push
        id: push
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_SERVICE_NAME }}/${{ vars.GCP_SERVICE_NAME }}"
          TAG="sha-${GITHUB_SHA::7}"
          docker build -t "${IMAGE}:${TAG}" -f backend/Dockerfile .
          docker push "${IMAGE}:${TAG}"
          DIGEST=$(gcloud artifacts docker images describe "${IMAGE}:${TAG}" --format="value(image_summary.digest)" | sed 's/^sha256://')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Deploy candidate revision (no traffic)
        id: candidate
        run: |
          TAG="ci-${GITHUB_SHA::7}"
          gcloud run deploy ${{ vars.GCP_SERVICE_NAME }} \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --region=${{ vars.GCP_REGION }} \
            --image="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_SERVICE_NAME }}/${{ vars.GCP_SERVICE_NAME }}@sha256:${{ steps.push.outputs.digest }}" \
            --no-traffic \
            --tag="${TAG}" \
            --quiet
          URL=$(gcloud run services describe ${{ vars.GCP_SERVICE_NAME }} --project=${{ vars.GCP_PROJECT_ID }} --region=${{ vars.GCP_REGION }} --format=json | jq -r --arg TAG "${TAG}" '.status.traffic[] | select(.tag == $TAG) | .url')
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Smoke test the candidate (NOT the live URL)
        id: smoke
        run: |
          set -e
          curl -sf "${{ steps.candidate.outputs.url }}/health"
          curl -sf "${{ steps.candidate.outputs.url }}/docs" -o /dev/null

      - uses: hashicorp/setup-terraform@v3
        if: success()

      - name: Promote via terraform apply
        if: success()
        working-directory: terraform
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_cloud_run_image_digest: ${{ steps.push.outputs.digest }}
        run: |
          terraform init -backend-config="bucket=${{ vars.GCP_PROJECT_ID }}-tfstate" -backend-config="prefix=memegpt-backend"
          terraform apply -auto-approve

      - name: Smoke test failed — report and stop (candidate never promoted)
        if: failure() && steps.candidate.outcome == 'success'
        run: |
          echo "::error::Smoke test failed against candidate revision (tag: ${{ steps.candidate.outputs.tag }}, url: ${{ steps.candidate.outputs.url }}). It was never promoted — live traffic is unaffected (still served by the previous revision). The untrafficked candidate revision can't be deleted this run (Cloud Run refuses to delete a service's most-recently-created revision), but it's still a live, publicly-invokable endpoint — it will be automatically deleted by the next push's cleanup sweep; to remove it sooner, inspect and delete manually: gcloud run revisions list --service=${{ vars.GCP_SERVICE_NAME }} --project=${{ vars.GCP_PROJECT_ID }} --region=${{ vars.GCP_REGION }}"
          exit 1

      - name: Delete stale untrafficked candidate revisions from prior runs
        if: always()
        continue-on-error: true # best-effort cleanup — must never flip an otherwise-successful deploy to failed
        run: |
          # Deliberately NOT based on `.status.traffic[]`'s tag data — a real,
          # documented terraform-provider-google issue (#8654) means a
          # `terraform apply` that touches this service strips tag/url info
          # from the traffic list on every apply, which silently made an
          # earlier version of this step blind to real orphans on every
          # successful run. `status.latestReadyRevision` doesn't have that
          # problem (a plain top-level field, not part of the traffic list),
          # so it's the only thing this step trusts to identify what must
          # survive; every other revision that exists for this service is a
          # deletion candidate.
          SERVING=$(gcloud run services describe ${{ vars.GCP_SERVICE_NAME }} --project=${{ vars.GCP_PROJECT_ID }} --region=${{ vars.GCP_REGION }} --format="value(status.latestReadyRevision)")
          gcloud run revisions list --service=${{ vars.GCP_SERVICE_NAME }} --project=${{ vars.GCP_PROJECT_ID }} --region=${{ vars.GCP_REGION }} --format="value(name)" \
            | while read -r rev; do
                if [ "${rev}" != "${SERVING}" ]; then
                  echo "Deleting non-serving revision: ${rev}"
                  gcloud run revisions delete "${rev}" --project=${{ vars.GCP_PROJECT_ID }} --region=${{ vars.GCP_REGION }} --quiet || echo "::warning::Could not delete ${rev} (may still be the latest-created revision — will retry next run)"
                fi
              done
